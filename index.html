<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Checkout</h1>

    <section>
        <h2>Your Cart</h2>

        <img src="assets/img/mindjuse_transparent.svg" alt="earrings">

    </section>

    <section class="formSection">

        <h2>Payment Information</h2>

        <form action="">

            <label for="card-name" required>Cardholder Name<span aria-hidden="true">*</span></label>
            <input 
                type="text" 
                id="card-name" 
                name="card-name">

            <label for="card-number">Card Number<span aria-hidden="true">*</span></label>
            <input 
                type="text" 
                id="card-number" 
                name="card-number" 
                required 
                pattern="[0-9]" 
                inputmode="numeric"
                autocomplete="cc-number"
                aria-describedby="card-number-help"
                aria-label="Credit Card Number">

            <p id="card-number-help" aria-describedby="card-number">Please enter your 16-digit card number without spaces or dashes.</p>

            <label for="exp-date" required>Expire Date<span aria-hidden="true">*</span></label>
            <input 
                type="number" 
                id="exp-date" 
                name="exp-date">

            <label for="cvv" required>CVV<span aria-hidden="true">*</span></label>
            <input 
                type="text" 
                id="cvv" 
                name="cvv"
                inputmode="numeric"
                maxlength="4"
                pattern="[0-9]{3,4}" 
                aria-label="CVV security code">
                
                <button type="submit">Place Order</button>

                <!-- input for card number and CVV is text by type, and inputmode is numeric, to avoid deleting zeros if type were number -->
                
            </form>
            
    </section>
    
</body>
</html>
