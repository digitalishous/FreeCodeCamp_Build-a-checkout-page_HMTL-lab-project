<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
</head>

<style>
body{
    text-align: center;
}

img{
    width: 80vw;
    height: 65vh;
    margin: 0 auto;
    display: block;
}

</style>
<body>

    <h1>Checkout</h1>

    <section>
        <h2>Your Cart</h2>

        <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fi.pinimg.com%2Foriginals%2F66%2Fa4%2F3c%2F66a43ccff280871dadfc75a1bb1e7140.jpg&f=1&nofb=1&ipt=082ad3007a7cca41286c938c7e07ea58da3d417c989a505b62d372345954a0bf" alt="">
    </section>

    <section>
        <h2>Payment Information</h2>

        <form action="">

            <label for="card-name" required>Cardholder Name<span aria-hidden="true">*</span></label>
            <input type="text" id="card-name" name="card-name">

            <label for="card-number">Card Number<span aria-hidden="true">*</span></label>
            <input 
                type="text" 
                id="card-number" 
                name="card-number" 
                required 
                pattern="[0-9]" 
                inputmode="numeric"
                autocomplete="cc-number"
                aria-label="Credit Card Number">

            <p id="card-number-help" aria-describedby="card-number">Please enter your 16-digit card number without spaces or dashes.</p>

            <label for="exp-date" required>Expire Date<span aria-hidden="true">*</span></label>
            <input type="number" id="exp-date" name="exp-date">

            <label for="cvv" required>CVV<span aria-hidden="true">*</span></label>
            <input type="text" id="cvv" name="cvv">

            <button type="button">Place Order</button>

        </form>

    </section>
    
</body>
</html>
